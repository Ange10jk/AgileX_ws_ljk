extends: base_RoboDojo.yaml

robot:
  move_speed_percent: 100

policy:
  backend: lcgen_http
  type: lcgen_http
  python: /usr/bin/python3
  checkpoint: null
  execution: chunk
  startup_timeout_sec: 12
  inference_timeout_sec: 35
  lcgen_http:
    url: http://100.113.96.55:8089
    request_mode: v1
    connect_timeout_sec: 2
    request_timeout_sec: 30
    # Copy the exact Piper URDF from the API host before starting.
    urdf_path: ../third_party/piper_description.urdf
    max_observation_skew_sec: 0.075

observation:
  fps: 30
  # Set task to one of the keys below to send its English instruction.
  task: stand_bottle_upright
  task_options:
    fill_pen_holder: "Fill the pen holder."
    put_objects_into_basket: "Put the objects into the basket."
    stack_and_cover_blocks: "Stack and cover the blocks."
    stack_bowls: "Stack the bowls."
    stand_bottle_upright: "Stand the bottle upright."

workflow:
  policy_hz: 30
  