# Official scene: https://robodojo-benchmark.com/doc/real-tasks/stack-bowls/
extends: ../collect_dual_RoboDojo.yaml
observation:
  task: Stack the bowls on the table.
  description: There are several bowls on the table. The robot needs to pick them up one by one and stack them neatly.
  fps: 30

workflow:
  policy_hz: 30

robot:
  control_hz: 30

record:
  queue_size: 16
  camera_queue_size: 64
  queue_diagnostics: false
  # Opt in after checking the ROS Python environment (see docs/configuration.md).
  camera_in_ros_worker: true
  camera_queue_policy: strict
  python: /home/robot/.venvs/piper-ros-realsense/bin/python
