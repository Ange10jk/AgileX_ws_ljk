# Official scene: https://robodojo-benchmark.com/doc/real-tasks/insert-charger/
extends: ../collect_dual_RoboDojo.yaml
observation:
  task: Insert the charger plug into the power strip, then connect the charging cable to the plug.
  description: There is a charger plug, a charging cable, and a power strip on the table. The robot needs to insert the charger plug into the power strip and then connect the charging cable to the plug.
  fps: 30

workflow:
  policy_hz: 30

robot:
  control_hz: 30

record:
  queue_size: 16
  camera_queue_size: 64
  queue_diagnostics: false
  # Opt in after checking the ROS Python environment (see docs/configuration.md).
  camera_in_ros_worker: true
  camera_queue_policy: strict
  python: /home/robot/.venvs/piper-ros-realsense/bin/python
