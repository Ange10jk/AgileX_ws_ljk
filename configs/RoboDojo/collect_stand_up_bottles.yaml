# Official scene: https://robodojo-benchmark.com/doc/real-tasks/stand-up-bottles/
extends: ../collect_dual_RoboDojo.yaml
observation:
  task: Stand the bottle upright.
  description: There is a bottle lying on the table. The robot needs to pick it up and place it upright on the table.
  fps: 30

workflow:
  policy_hz: 30

robot:
  control_hz: 30

record:
  queue_size: 256
  camera_queue_size: 32
  queue_diagnostics: false
  # Opt in after checking the ROS Python environment (see docs/configuration.md).
  camera_in_ros_worker: true
  camera_queue_policy: strict
  python: /home/robot/.venvs/piper-ros-realsense/bin/python