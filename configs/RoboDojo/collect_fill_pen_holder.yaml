# Official scene: https://robodojo-benchmark.com/doc/real-tasks/fill-pen-holder/
extends: ../collect_dual_RoboDojo.yaml
observation:
  task: Pick up the pen holder and place all the pens into it.
  description: There is a pen holder and several pens on the table. The robot needs to pick up the pen holder and place all the pens into it one by one.
  fps: 30

workflow:
  policy_hz: 30

robot:
  control_hz: 30

record:
  queue_size: 16
  camera_queue_size: 64
  queue_diagnostics: false
  # Opt in after checking the ROS Python environment (see docs/configuration.md).
  camera_in_ros_worker: true
  camera_queue_policy: strict
  python: /home/robot/.venvs/piper-ros-realsense/bin/python
